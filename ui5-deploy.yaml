# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zvendorsearch
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://my402221.s4hana.cloud.sap
        app:
          name: ZVEOB_SUPPLIER
          description: Vendor Onboarding Supplier Search
          package: ZAPP_VEOB
        exclude:
          - /test/
  resources:
    excludes:
      - /test/**
      - /localService/**
